name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: sparta
          MARIADB_USER: sparta
          MARIADB_PASSWORD: sparta
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 33306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "33306"
      DB_NAME: sparta
      DB_USER: sparta
      DB_PASSWORD: sparta
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: curl, pdo_mysql, mbstring, fileinfo

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Import schema, routines, and seed data
        run: |
          set -euo pipefail
          mariadb -h 127.0.0.1 -P 33306 -u sparta -psparta sparta < database/schema.sql
          mariadb -h 127.0.0.1 -P 33306 -u sparta -psparta sparta < database/routines.sql
          php database/seeders/seed.php
          mkdir -p public/uploads/alat

      - name: Run test suite
        run: |
          set -uo pipefail
          failed=0
          for t in \
            tests/database_config_test.php \
            tests/security_test.php \
            tests/database/schema_test.php \
            tests/http_auth_test.php \
            tests/http_master_data_test.php \
            tests/http_users_test.php \
            tests/http_loans_test.php \
            tests/http_returns_test.php \
            tests/http_backoffice_test.php
          do
            echo "::group::$t"
            if php "$t"; then
              echo "ok: $t"
            else
              code=$?
              echo "::error::$t failed (exit $code)"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
