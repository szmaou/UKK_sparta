server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Uploaded files are static only: never hand them to PHP-FPM.
    # The nested regex must live here because this ^~ prefix would otherwise
    # win over the global \.php$ handler, which would execute uploads.
    location ^~ /uploads/ {
        location ~* \.(?:php\d*|phtml|phar|cgi|pl|py|sh|shtml|htaccess)$ {
            deny all;
        }
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
