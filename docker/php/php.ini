expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 128M
upload_max_filesize = 2M
post_max_size = 8M
max_file_uploads = 5
date.timezone = Asia/Jakarta
session.cookie_httponly = 1
session.use_strict_mode = 1
; Persisted volume: recreating the container must not log every user out.
session.save_path = /var/lib/php/sessions
